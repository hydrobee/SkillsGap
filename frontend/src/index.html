<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SkillsGap</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply the theme before the first paint so the page never flashes the wrong colours.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('skillsgap.theme'); } catch (e) { /* storage blocked */ }
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
